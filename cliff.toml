[changelog]
header = "# Changelog\n\n"
body = """
{%- set repo = get_env(name="CHANGELOG_REPOSITORY_URL", default="") -%}
{% if version %}## [{{ version }}]({{ repo }}/releases/tag/{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
protect_breaking_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = '^[a-z]+(\([^)]*\))?!:', group = "<!-- 3 -->Breaking changes" },
  { footer = "^BREAKING[ -]CHANGE:", group = "<!-- 3 -->Breaking changes" },
  { message = "^.*", skip = true },
]
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
