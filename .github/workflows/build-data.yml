# Checks NOAA and ECCC every 15 minutes for new model runs and publishes
# derived per-site forecast documents to the private R2 bucket named by the
# METEO_R2_BUCKET repository variable. A no-new-run check is cheap (one
# listing/capabilities request per model plus one manifest GET); uploads only
# happen when a run actually advances.
#
# Site identity lives in the dataset bucket, not this repo: builders run
# --sites dataset, reading sites.json from the bucket and refusing to build
# without it. This operator never writes sites.json — see README.md.
#
# The engine is the published @azohra/meteo.forecast npm package, pinned in
# package.json. Every job fails fast via the engine-guard step below if it's
# ever missing (no fallback to an unrelated registry package named "meteo").
#
# METEO_DATA_BASE is intentionally never set: with R2_ENDPOINT +
# AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY present, the engine reads its own
# publish state through the authenticated S3 endpoint. Setting
# METEO_DATA_BASE would switch it to the public HTTPS path, which can't see
# unpublished state.
#
# Builds are split into one job per provider host to respect each host's
# rate limits, with FETCH_CONCURRENCY capped per job (5 for ECCC Datamart
# hosts, 10 for NOAA S3 buckets). ECCC is further split across its two
# mirrors (dd.weather.gc.ca and the higher-bandwidth hpfx.collab.science.gc.ca)
# with the heavier model streams (HRDPS, GEPS, REPS) routed to hpfx.
name: Build forecast data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NOAA builders pull GRIB records by byte range and are lighter than the
  # ECCC streams, so this job has its own concurrency group — a slow ECCC
  # run shouldn't block the next NOAA tick.
  noaa:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: build-noaa
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse to run without the pinned engine
        run: test -e node_modules/.bin/meteo || { echo "::error::@azohra/meteo.forecast is not installed — refusing to fall back to an unrelated registry package named meteo (README.md)"; exit 1; }
      # Each model publishes as soon as it finishes, so a timeout later in
      # the job doesn't lose work that already completed. Lightest/freshest
      # (GOES) first, heaviest (the CONUS nest, then experimental RRFS) last.
      - name: Build GOES-18 DSR observations (failure must not block the others)
        run: pnpm exec meteo forecast build --model goes18-dsr --sites dataset --output data || echo "::warning::GOES-18 DSR build failed"
      - name: Publish GOES-18 DSR
        run: pnpm exec meteo forecast publish --model goes18-dsr
      - name: Build GOES-18 AOD observations (failure must not block the others)
        run: pnpm exec meteo forecast build --model goes18-aod --sites dataset --output data || echo "::warning::GOES-18 AOD build failed"
      - name: Publish GOES-18 AOD
        run: pnpm exec meteo forecast publish --model goes18-aod
      - name: Build HRRR 3 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model hrrr-conus --sites dataset --output data || echo "::warning::HRRR build failed"
      - name: Publish HRRR
        run: pnpm exec meteo forecast publish --model hrrr-conus
      - name: Build GFS 25 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model gfs --sites dataset --output data || echo "::warning::GFS build failed"
      - name: Publish GFS
        run: pnpm exec meteo forecast publish --model gfs
      - name: Build NAM 12 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model nam --sites dataset --output data || echo "::warning::NAM 12 km build failed"
      - name: Publish NAM 12 km
        run: pnpm exec meteo forecast publish --model nam
      - name: Build NAM CONUS nest 3 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model nam-conus-nest --sites dataset --output data || echo "::warning::NAM nest build failed"
      - name: Publish NAM CONUS nest
        run: pnpm exec meteo forecast publish --model nam-conus-nest
      - name: Build RRFS 3 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model rrfs --sites dataset --output data || echo "::warning::RRFS build failed"
      - name: Publish RRFS
        run: pnpm exec meteo forecast publish --model rrfs

  # dd.weather.gc.ca half of the ECCC split, plus the dd.alpha-only 1 km feed.
  eccc-dd:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: build-eccc-dd
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse to run without the pinned engine
        run: test -e node_modules/.bin/meteo || { echo "::error::@azohra/meteo.forecast is not installed — refusing to fall back to an unrelated registry package named meteo (README.md)"; exit 1; }
      - name: Build HRDPS 1 km (experimental feed; dd.alpha-only)
        run: pnpm exec meteo forecast build --model hrdps-west --sites dataset --output data || echo "::warning::1 km build failed"
      - name: Publish HRDPS 1 km
        run: pnpm exec meteo forecast publish --model hrdps-west
      - name: Build RDPS 10 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model rdps --sites dataset --output data || echo "::warning::RDPS build failed"
      - name: Publish RDPS
        run: pnpm exec meteo forecast publish --model rdps
      - name: Build GDPS 15 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model gdps --sites dataset --output data || echo "::warning::GDPS build failed"
      - name: Publish GDPS
        run: pnpm exec meteo forecast publish --model gdps

  # hpfx.collab.science.gc.ca half of the ECCC split — carries the heaviest
  # streams (HRDPS, RAQDPS, REPS, GEPS) because it's measurably faster than dd.
  eccc-hpfx:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: build-eccc-hpfx
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
      METEO_DATAMART_BASE: https://hpfx.collab.science.gc.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse to run without the pinned engine
        run: test -e node_modules/.bin/meteo || { echo "::error::@azohra/meteo.forecast is not installed — refusing to fall back to an unrelated registry package named meteo (README.md)"; exit 1; }
      - name: Build HRDPS 2.5 km (failure must not block the others)
        run: pnpm exec meteo forecast build --model hrdps-continental --sites dataset --output data || echo "::warning::HRDPS build failed"
      - name: Publish HRDPS 2.5 km
        run: pnpm exec meteo forecast publish --model hrdps-continental
      - name: Build RAQDPS smoke (failure must not block the others)
        run: pnpm exec meteo forecast build --model raqdps --sites dataset --output data || echo "::warning::RAQDPS build failed"
      - name: Publish RAQDPS smoke
        run: pnpm exec meteo forecast publish --model raqdps
      - name: Build REPS 10 km ensemble (failure must not block the others)
        run: pnpm exec meteo forecast build --model reps --sites dataset --output data || echo "::warning::REPS build failed"
      - name: Publish REPS
        run: pnpm exec meteo forecast publish --model reps
      - name: Build GEPS 0.5° ensemble (failure must not block the others)
        run: pnpm exec meteo forecast build --model geps --sites dataset --output data || echo "::warning::GEPS build failed"
      - name: Publish GEPS
        run: pnpm exec meteo forecast publish --model geps

  # Regenerates site-context.json when the site catalogue changes, and warns
  # once per tick if the engine pin is behind the latest npm release.
  terrain:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: terrain
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse to run without the pinned engine
        run: test -e node_modules/.bin/meteo || { echo "::error::@azohra/meteo.forecast is not installed — refusing to fall back to an unrelated registry package named meteo (README.md)"; exit 1; }
      - name: Keep the site context following the catalogue
        run: pnpm exec meteo forecast terrain --sync
      - name: Warn when the pin trails the released engine
        run: |
          latest=$(pnpm view @azohra/meteo.forecast version)
          pinned=$(node -p "require('@azohra/meteo.forecast/package.json').version")
          [ "$latest" = "$pinned" ] || echo "::warning::engine pin $pinned trails npm latest $latest"
