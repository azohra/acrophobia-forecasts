# Publishes the engine's model catalogue — models.json, emitted by the
# pinned engine, so an engine upgrade that changes the model catalogue
# republishes it via the lockfile path filter — to the private dataset
# bucket's root.
#
# The other two root catalogues, sites.json and site-context.json, are the
# club's: they live only in the dataset bucket, never in this public
# repository, and this operator reads them without ever writing them.
# Maintaining them is documented in README.md.
#
# The model catalogue publishes only from here, only from main, in one
# concurrency group: this structurally replaces the source pipeline's
# catalogue-epoch race guard, which existed because catalogues rode along
# on racing per-model upload jobs. Model uploads (build-data.yml) never
# touch it.
#
# The engine @azohra/meteo.forecast is published on npmjs.com under the
# @azohra scope and pinned in package.json — the engine guard step fails
# fast if it is ever missing. Repository configuration: README.md.
name: Publish catalogues

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-catalogues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The README's rule that publishing runs only from the default branch,
    # by push or owner dispatch, holds by mechanism: a dispatch from any
    # other ref skips the job instead of running with secrets.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    # The engine publishes through the authenticated S3 endpoint; no aws CLI.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Without the local install, npx would fall back to fetching a
      # registry package named "meteo" — never publish anything but the
      # pinned engine's catalogue.
      - name: Refuse to run without the pinned engine
        run: test -e node_modules/.bin/meteo || { echo "::error::@azohra/meteo.forecast is not installed — refusing to fall back to an unrelated registry package named meteo (README.md)"; exit 1; }
      - name: Publish the model catalogue
        run: pnpm exec meteo forecast publish --models
