# Publishes models.json (the engine's model catalogue) to the private
# dataset bucket whenever the lockfile changes — an engine upgrade that
# changes the catalogue republishes it automatically. The body is the
# publish:catalogues mise task (see mise.toml).
#
# Runs in its own concurrency group, separate from build-data.yml's per-model
# uploads, so catalogue publishes can't race with them.
name: Publish catalogues

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-catalogues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      METEO_S3_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      METEO_R2_BUCKET: ${{ vars.METEO_R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@v4
      - run: mise run publish:catalogues
