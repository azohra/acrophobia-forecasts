name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the next version and notes without releasing
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    uses: azohra/workflows/.github/workflows/release.yml@50641c91a47255975b2ac20fb381a236958eb9b7
    with:
      dry-run: ${{ inputs.dry-run }}
